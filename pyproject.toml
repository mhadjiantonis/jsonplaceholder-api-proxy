[tool.poetry]
name = "jsonplaceholder-api-proxy"
version = "2026.0.2"
description = ""
authors = ["Marios Hadjiantonis <mhadjiantonis@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.139.0" }
pydantic = "^2.13.4"
httpx2 = "^2.12.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
black = "^26.5.1"

[tool.coverage.run]
branch = true

[tool.pytest]
junit_family = "legacy"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
